services:
  - type: keyvalue
    name: mahalla-marketplace-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    persistenceMode: off
    ipAllowList: []

  - type: web
    name: mahalla-marketplace-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node apps/api/scripts/render-entrypoint.cjs
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mahalla-marketplace-redis
          property: connectionString
      - key: WEB_ORIGIN
        value: https://mahalla-marketplace-web.onrender.com
      - key: PUBLIC_SITE_URL
        value: https://mahalla-marketplace-web.onrender.com
      - key: REQUIRE_CONTACT_VERIFICATION
        value: "true"
      - key: AUTH_CHALLENGE_TEST_MODE
        value: "false"
      - key: SMS_AUTH_ENABLED
        value: "false"
      - key: PRODUCT_UPLOADS_ENABLED
        value: "false"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: REFERRAL_REWARD_PAISA
        value: "10000"
      - key: HIGH_VALUE_ORDER_PAISA
        value: "1000000"
      - key: AUDIT_RETENTION_DAYS
        value: "365"
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false

  - type: web
    name: mahalla-marketplace-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://mahalla-marketplace-api.onrender.com/api/v1
      - key: API_INTERNAL_URL
        value: https://mahalla-marketplace-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_SITE_URL
        value: https://mahalla-marketplace-web.onrender.com
