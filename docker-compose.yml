services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mahalla}
      MYSQL_USER: ${MYSQL_USER:-mahalla}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_mahalla_password}
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-local_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${API_NODE_ENV:-development}
      API_PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER:-mahalla}:${MYSQL_PASSWORD:-local_mahalla_password}@mysql:3306/${MYSQL_DATABASE:-mahalla}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000,http://localhost:3001,http://localhost:8081}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3001}
      REFERRAL_REWARD_PAISA: ${REFERRAL_REWARD_PAISA:-10000}
      HIGH_VALUE_ORDER_PAISA: ${HIGH_VALUE_ORDER_PAISA:-1000000}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      REQUIRE_CONTACT_VERIFICATION: ${REQUIRE_CONTACT_VERIFICATION:-false}
      AUTH_CHALLENGE_TEST_MODE: ${AUTH_CHALLENGE_TEST_MODE:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    command: ["sh", "-c", "node apps/api/node_modules/prisma/build/index.js migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/dist/main.js"]
    ports: ["4000:4000"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000/api/v1}
    ports: ["${WEB_HOST_PORT:-3001}:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  mysql_data:
  redis_data:
